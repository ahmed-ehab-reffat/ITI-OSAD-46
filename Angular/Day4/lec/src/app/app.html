<header class="app-header">
  <div class="logo">
    🚀 <span>Angular Forms</span>
  </div>

  <nav class="nav-bar">
    <a routerLink="/home" routerLinkActive="active">Home</a>
    <a routerLink="/about" routerLinkActive="active">About</a>
    <a routerLink="/contact" routerLinkActive="active">Contact</a>
  </nav>

  <div class="auth-section">
    <!-- Not logged in -->
    <ng-container *ngIf="!isLoggedIn; else loggedIn">
      <a class="btn ghost" routerLink="/login">Login</a>
      <a class="btn primary" routerLink="/register">Register</a>
    </ng-container>

    <!-- Logged in -->
    <ng-template #loggedIn>
      <div class="user-chip">
        <span class="avatar">{{ userName[0] | uppercase }}</span>
        <span class="name">Hi, {{ userName }}</span>
        <button class="btn logout" (click)="logout()">Logout</button>
      </div>
    </ng-template>
  </div>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
