<section id="contact" class="py-5 bg-white">
  <div class="container">
    <div class="row g-4 align-items-center">
      <div class="col-md-5">
        <h3 class="mb-2">Get in touch</h3>
        <p class="text-muted mb-3">
          I’m available for freelance projects and full-time roles. Send me a message and I’ll reply
          shortly.
        </p>
        <p class="mb-0">
          <strong>Email: </strong>
          <a href="mailto:ahmed.ehab.reffat@gmail.com">ahmed.ehab.reffat@gmail.com</a>
        </p>
        <div class="mt-3">
          <a class="me-3 text-dark" href="#" target="_blank" aria-label="facebook"
            ><i class="fab fa-facebook fa-lg"></i
          ></a>
          <a class="me-3 text-dark" href="#" target="_blank" aria-label="github"
            ><i class="fab fa-github fa-lg"></i
          ></a>
          <a class="text-dark" href="#" target="_blank" aria-label="linkedin"
            ><i class="fab fa-linkedin fa-lg"></i
          ></a>
        </div>
      </div>
      <div class="col-md-7">
        <form (submit)="submit($event)" class="row gx-2 gy-2">
          <div class="col-md-6">
            <input name="name" class="form-control" placeholder="Your name" required />
          </div>
          <div class="col-md-6">
            <input name="email" type="email" class="form-control" placeholder="Email" required />
          </div>
          <div class="col-12">
            <textarea
              name="message"
              class="form-control"
              rows="4"
              placeholder="Message"
              required
            ></textarea>
          </div>
          <div class="col-12 text-end">
            <button class="btn btn-primary">Send Message</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
