{% extends 'base.html' %} {% block content %}

<h2 style="color: #2c3e50; margin-bottom: 24px">📬 Contact Us</h2>

<div
  style="
    background: white;
    padding: 24px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    max-width: 560px;
  "
>
  <h3 style="margin-bottom: 16px">Send us your Feedback</h3>

  <form method="POST">
    {% csrf_token %} {% for field in form %}
    <div style="margin-bottom: 16px">
      <label style="display: block; margin-bottom: 6px; font-weight: bold">
        {{ field.label }}
      </label>
      {{ field }} {% if field.errors %}
      <p style="color: red; margin-top: 4px">{{ field.errors }}</p>
      {% endif %}
    </div>
    {% endfor %}

    <button
      type="submit"
      style="
        background: #2c3e50;
        color: white;
        padding: 10px 24px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 15px;
      "
    >
      Send Feedback
    </button>
  </form>
</div>

{% endblock %}
